# Edit the example paths below directly before running.
model:
  name_or_path: /path/to/your/Qwen2.5-VL-7B-Instruct
  sft_adapter: /path/to/your/checkpoints/sft
  sft_merged: false
  trust_remote_code: false
  torch_dtype: bfloat16
  image_max_pixels: 262144
  device_map: null

data:
  train_file: /path/to/your/data/grpo_train.json
  image_path_mappings: {}
  max_samples: null

environment:
  tool_config: configs/tools.example.yaml
  max_cycles: 6
  reward_weights: [0.15, 0.15, 0.70]
  psnr_norm: 30
  ssim_mode: gray

lora:
  rank: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  output_dir: /path/to/your/checkpoints/grpo
  num_generations: 8
  max_completion_length: 128
  temperature: 0.8
  learning_rate: 0.0000005
  num_train_epochs: 3
  gradient_checkpointing: true
  device: cuda
  kl_beta: 0.05
  clip_range: 0.2
  max_grad_norm: 1.0
  save_steps: 50
  max_steps: null
  resume_from_checkpoint: null
  seed: 42
