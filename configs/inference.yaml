# Edit the example paths below directly before running.
model:
  name_or_path: /path/to/your/Qwen2.5-VL-7B-Instruct
  sft_adapter: /path/to/your/checkpoints/sft
  grpo_adapter: /path/to/your/checkpoints/grpo
  trust_remote_code: false
  torch_dtype: bfloat16
  image_max_pixels: null

inference:
  input_dir: /path/to/your/degraded_images
  output_dir: /path/to/your/restored_images
  # Set a matching reference directory for paired PSNR/SSIM, or null without GT.
  reference_dir: null
  # reference_dir: /path/to/your/reference_images
  tool_config: configs/tools.example.yaml
  max_cycles: 6
  max_new_tokens: 512
  ssim_mode: gray
