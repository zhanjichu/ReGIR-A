[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regir-a"
version = "0.1.0"
description = "A multimodal agent for iterative image restoration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.scripts]
regir-infer = "inference.pipeline:main"
regir-sft = "training.sft:main"
regir-grpo = "training.grpo:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "training*", "inference*"]
